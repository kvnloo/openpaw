name: OpenPaw synthetic checks

'on':
  pull_request:
    paths:
      - 'demo/**'
      - 'fixtures/**'
      - 'schema/**'
      - 'tests/**'
      - '.github/workflows/synthetic-demo-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify synthetic contracts and offline review linkage
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pip install 'jsonschema==4.26.0'
          python -m unittest discover -s tests -v
      - name: Smoke-test standalone offline render
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python demo/render_timeline.py --output /tmp/openpaw-fictional-preview.html
          test -s /tmp/openpaw-fictional-preview.html
