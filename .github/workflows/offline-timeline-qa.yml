name: OpenPaw offline timeline QA

on:
  pull_request:
    paths:
      - 'demo/**'
      - 'tests/test_timeline.py'
      - 'fixtures/fictional-week.jsonl'
      - '.github/workflows/offline-timeline-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-timeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate synthetic timeline source and HTML
        run: python -m unittest discover -s tests -p 'test_timeline.py' -v
      - name: Generate independent offline artifact
        run: |
          python demo/render_timeline.py
          test -s demo/timeline.html
          grep -q 'SYNTHETIC RECORDS ONLY' demo/timeline.html
