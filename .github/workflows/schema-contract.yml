name: OpenPaw schema contract

on:
  pull_request:
    paths:
      - 'schema/openpaw-event.schema.json'
      - 'tests/test_event_schema.py'
      - '.github/workflows/schema-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Check OpenPaw derived-state contract
        run: python -m unittest discover -s tests -p 'test_event_schema.py' -v
