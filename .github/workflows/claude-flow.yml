name: Claude guided flow
# Keeps /build-collar and /verify-collar honest: links, prices and paths come
# from the repo, and the data formats match the firmware and the app.
on:
  pull_request:
    paths:
      - '.claude/**'
      - 'docs/COLLAR.md'
      - 'app/openpaw-ble.js'
      - 'firmware/openpaw-collar/**'
      - 'tests/test_claude_commands.py'
      - '.github/workflows/claude-flow.yml'
  push:
    branches: [main]
    paths:
      - '.claude/**'
      - 'docs/COLLAR.md'
      - 'app/openpaw-ble.js'
      - 'firmware/openpaw-collar/**'
      - 'tests/test_claude_commands.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commands:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Claude commands against the repo
        run: python -m unittest discover -s tests -p 'test_claude_commands.py' -v
