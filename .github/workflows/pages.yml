name: pages
# Publishes the landing page (site/) at https://kvnloo.github.io/openpaw/ and the collar app (app/) at /openpaw/app/
on:
  push:
    branches: [main]
    paths: ['app/**', 'site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test app/test/*.test.mjs site/test/*.test.mjs
      - name: Stage site (landing at root, app under /app, no tests)
        run: |
          mkdir -p _site/app
          cp -R site/. _site/
          rm -rf _site/test
          cp app/*.html app/*.js _site/app/
          # app pages reference ../site/fonts (works in the repo checkout); publish the same path
          mkdir -p _site/site && cp -R site/fonts _site/site/fonts
          touch _site/.nojekyll
          # every local href/src in the landing page must exist in the staged site
          grep -oE '(href|src)="[^"#:]+"' _site/index.html | sed -E 's/.*="([^"]+)"/\1/' | while read -r f; do
            [ -e "_site/${f%/}" ] || [ -e "_site/${f}index.html" ] || { echo "missing: $f"; exit 1; }
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # deploy-pages sometimes can't see the just-uploaded artifact yet ("Fetching artifact metadata
      # failed"); every manual rerun has succeeded, so wait once and retry instead of failing the deploy.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
