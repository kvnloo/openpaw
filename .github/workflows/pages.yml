name: pages
# Publishes the landing page (site/) at https://kvnloo.github.io/openpaw/ and the collar app (app/) at /openpaw/app/
on:
  push:
    branches: [main]
    paths: ['app/**', 'site/**', 'tools/stage-pages.sh', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test app/test/*.test.mjs site/test/*.test.mjs
      - name: Stage site (landing at root, app under /app, no tests)
        run: bash tools/stage-pages.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # deploy-pages sometimes can't see the just-uploaded artifact yet ("Fetching artifact metadata
      # failed"); every manual rerun has succeeded, so wait once and retry instead of failing the deploy.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
